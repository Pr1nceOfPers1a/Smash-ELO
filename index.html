<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Smash ELO">
<meta name="theme-color" content="#14121f"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<title>Smash ELO</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1b1730;--mu:#6d6890;--ac:#e5322d;--ok:#16a34a;--bad:#dc2626;--ln:#e2deef;--in:#f6f4fb;--g:#e8e4f3}
@media (prefers-color-scheme:dark){:root{--bg:#14121f;--card:#1f1b33;--tx:#f3f1ff;--mu:#9a95b8;--ac:#ff4d4d;--ok:#4ade80;--bad:#f87171;--ln:#2e2947;--in:#120f1e;--g:#2e2947}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h1 span{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;min-width:0;max-width:100%}
input.n{flex:1}input.p{width:64px;text-align:center}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.g{background:var(--g);color:var(--tx)}button.x{background:none;color:var(--mu);padding:6px 10px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;background:var(--g);color:var(--tx)}.seg button.on{background:var(--ac);color:#fff}
.lb{display:flex;align-items:center;gap:10px}.rk{width:26px;color:var(--mu);font-weight:700}
.nm{flex:1;font-weight:600}.sub{color:var(--mu);font-size:13px}.elo{font-size:22px;font-weight:700}
.tri{display:flex;justify-content:space-around;text-align:center;margin-top:6px}
.up{color:var(--ok)}.dn{color:var(--bad)}.msg{color:var(--mu);font-size:14px;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:16px 0}nav button.on{color:var(--ac)}
</style></head><body><main><h1>SMASH <span>ELO</span></h1><div id="v"></div></main>
<nav><button data-t="lb">Ranks</button><button data-t="add">Add match</button><button data-t="hist">History</button><button data-t="set">Settings</button></nav>
<input type="file" id="f" accept="image/*" hidden>
<script src="/elo.js"></script>
<script>
const LB={all:"Overall",one:"1v1",ffa:"FFA"};
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k)||"":localStorage.setItem(k,v)}catch(e){return""}};
let ms=[],tab="lb",board="all",sel="",draft=[{name:"",place:1},{name:"",place:2}],note="",D=null;
let me=ls("me"),pass=ls("pass"),admin=ls("admin");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sg=x=>(x>=0?"+":"")+x.toFixed(1);
const api=async(p,o={})=>{const r=await fetch("/api/"+p,{headers:{"content-type":"application/json"},...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Something went wrong"),{status:r.status});return j};
async function load(){try{ms=await api("matches");ms.sort((a,b)=>new Date(a.ts)-new Date(b.ts));if(tab!="add")render();else D=ELO.compute(ms)}catch(e){}}
function spark(h){
  if(h.length<2)return"";const v=h.map(x=>x.r),lo=Math.min(...v),hi=Math.max(...v),sp=Math.max(hi-lo,1);
  const pts=v.map((y,i)=>`${(i/(v.length-1)*296+2).toFixed(1)},${(56-(y-lo)/sp*52).toFixed(1)}`).join(" ");
  return`<svg viewBox="0 0 300 60" width="100%" height="60"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts}"/></svg><div class="sub">Overall rating over time: ${Math.round(lo)} to ${Math.round(hi)}</div>`;
}
const tri=p=>`<div class="tri">${["all","one","ffa"].map(t=>`<div><div class="elo">${p.g[t]?Math.round(p.r[t]):"—"}</div><div class="sub">${LB[t]}</div></div>`).join("")}</div>`;
function render(){
  D=ELO.compute(ms);const P=D.players,v=document.getElementById("v");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
  if(tab=="lb"){
    if(sel&&P[sel]){
      const p=P[sel],h=Object.entries(p.h2h).sort((a,b)=>(b[1].w+b[1].l+b[1].t)-(a[1].w+a[1].l+a[1].t));
      v.innerHTML=`<button class="g" onclick="sel='';render()">← Back</button><div class="card" style="margin-top:10px"><div class="nm" style="font-size:20px">${esc(p.name)} ${p.streak>=2?"🔥 "+p.streak:""}</div><div class="sub">${p.w}W · ${p.l}L · ${p.g.all} games</div>${tri(p)}<div class="sub" style="text-align:center;margin-top:6px">${p.g.one} 1v1 games · ${p.g.ffa} FFA games</div></div><div class="card">${spark(p.hist)||'<div class="sub">Play more matches to see a chart.</div>'}</div><div class="card"><b>Head to head</b>${h.map(([n,x])=>`<div class="row" style="margin:6px 0 0"><span class="nm">${esc(n)}</span><span class="${x.w>x.l?"up":x.w<x.l?"dn":"sub"}">${x.w}–${x.l}${x.t?"–"+x.t:""}</span></div>`).join("")}</div>`;return;
    }
    let h="";
    if(!me&&Object.keys(P).length)h+=`<div class="card"><div class="sub">Who are you? Pick your name to see your ratings here.</div><select onchange="me=this.value;ls('me',me);render()"><option value="">Choose…</option>${Object.keys(P).sort().map(n=>`<option>${esc(n)}</option>`).join("")}</select></div>`;
    if(me&&P[me])h+=`<div class="card" data-n="${esc(me)}"><div class="sub">You · ${esc(me)}</div>${tri(P[me])}</div>`;
    h+=`<div class="seg">${Object.keys(LB).map(t=>`<button class="${board==t?"on":""}" onclick="board='${t}';render()">${LB[t]}</button>`).join("")}</div>`;
    const L=Object.values(P).filter(p=>p.g[board]).sort((a,b)=>b.r[board]-a.r[board]);
    h+=L.length?L.map((p,i)=>`<div class="card lb" data-n="${esc(p.name)}"><div class="rk">${i+1}</div><div class="nm">${esc(p.name)} ${p.streak>=2?"🔥"+p.streak:""}<div class="sub">${p.g[board]} games</div></div><div class="elo">${Math.round(p.r[board])}</div></div>`).join(""):`<p class="msg">No ${LB[board]} matches yet.</p>`;
    v.innerHTML=h;
  }
  if(tab=="add"){
    if(!pass){v.innerHTML=`<div class="card"><b>Group passcode</b><div class="msg">Ask the group admin for the passcode to add matches.</div><div class="row"><input class="n" type="password" id="pc" placeholder="Passcode"><button onclick="pass=document.getElementById('pc').value.trim();ls('pass',pass);render()">Save</button></div></div>`;return}
    v.innerHTML=`<datalist id="dl">${Object.keys(P).map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <div class="card"><button class="g" style="width:100%" onclick="document.getElementById('f').click()">📷 Scan result screen</button><div class="msg" id="st">${esc(note)}</div></div>
    <div class="card">${draft.map((r,i)=>`<div class="row"><input class="p" type="number" min="1" max="8" value="${r.place}" onchange="draft[${i}].place=+this.value||1" aria-label="Place"><input class="n" list="dl" placeholder="Username" value="${esc(r.name)}" onchange="draft[${i}].name=this.value"><button class="x" onclick="draft.splice(${i},1);render()">✕</button></div>`).join("")}
    <div class="row"><button class="g" onclick="if(draft.length<8){draft.push({name:'',place:draft.length+1});render()}">+ Player</button><button id="sv" style="flex:1" onclick="saveMatch()">Save match</button></div>
    <div class="msg">Place 1 = winner. Tied players share a number. 2 players = 1v1, 3 or more = FFA.</div></div>`;
  }
  if(tab=="hist"){
    v.innerHTML=ms.length?D.matches.slice().reverse().map(m=>`<div class="card"><div class="row"><span class="sub" style="flex:1">${new Date(m.ts).toLocaleString()} · ${LB[m.mode]}</span>${admin?`<button class="x" onclick="del('${esc(m.id)}')">Delete</button>`:""}</div>${m.results.slice().sort((a,b)=>a.place-b.place).map(x=>`<div class="row" style="margin:2px 0"><span class="rk">${x.place}</span><span class="nm">${esc(x.name)}</span><span class="${m.d.mode[x.name]>=0?"up":"dn"}">${LB[m.mode]} ${sg(m.d.mode[x.name])}</span><span class="sub">All ${sg(m.d.all[x.name])}</span></div>`).join("")}</div>`).join(""):`<p class="msg">No matches yet.</p>`;
  }
  if(tab=="set"){
    v.innerHTML=`<div class="card"><b>Group passcode</b><div class="row" style="margin-top:8px"><input class="n" type="password" value="${esc(pass)}" onchange="pass=this.value.trim();ls('pass',pass)"></div></div>
    <div class="card"><b>Admin passcode</b><div class="msg">Only needed to delete matches.</div><div class="row"><input class="n" type="password" value="${esc(admin)}" onchange="admin=this.value.trim();ls('admin',admin)"></div></div>
    <div class="card"><b>You are</b><div class="row" style="margin-top:8px"><select onchange="me=this.value;ls('me',me)"><option value="">Choose…</option>${Object.keys(P).sort().map(n=>`<option ${n==me?"selected":""}>${esc(n)}</option>`).join("")}</select></div></div>
    <div class="card"><button class="g" onclick="csv()">Export matches (CSV)</button></div>`;
  }
}
document.querySelector("nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;sel="";render()}};
document.getElementById("v").onclick=e=>{const c=e.target.closest("[data-n]");if(c&&tab=="lb"){sel=c.dataset.n;render();scrollTo(0,0)}};
async function saveMatch(){
  const known=Object.keys(D.players);
  const r=draft.map(x=>{const n=x.name.trim();return{name:known.find(k=>k.toLowerCase()==n.toLowerCase())||n,place:x.place}}).filter(x=>x.name);
  if(r.length<2)return alert("Need at least two players.");
  if(new Set(r.map(x=>x.name.toLowerCase())).size<r.length)return alert("Each username must be unique.");
  const b=document.getElementById("sv");b.disabled=true;
  try{await api("matches",{method:"POST",body:JSON.stringify({passcode:pass,results:r})});draft=[{name:"",place:1},{name:"",place:2}];note="";tab="lb";await load();render()}
  catch(e){if(e.status==401){pass="";ls("pass","");render()}alert(e.message);b.disabled=false}
}
async function del(id){if(!confirm("Delete this match? Ratings will be recalculated."))return;try{await api("matches",{method:"DELETE",body:JSON.stringify({admin,id})});await load()}catch(e){alert(e.message)}}
function csv(){
  const rows=["match_id,date,mode,place,player"];
  D.matches.forEach(m=>m.results.forEach(x=>rows.push([m.id,new Date(m.ts).toISOString(),LB[m.mode],x.place,'"'+x.name.replace(/"/g,'""')+'"'].join(","))));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));a.download="smash-elo-matches.csv";a.click();
}
async function shrink(file){
  const bm=await createImageBitmap(file),s=Math.min(1,1600/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=bm.width*s;c.height=bm.height*s;
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.85).split(",")[1];
}
document.getElementById("f").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  document.getElementById("st").textContent="Reading screenshot…";
  try{
    const j=await api("scan",{method:"POST",body:JSON.stringify({passcode:pass,image:await shrink(file)})});
    if(j.players.length<2){note="Couldn't read that screen. Enter results by hand."}
    else{draft=j.players.map(p=>({name:String(p.name||""),place:+p.place||1}));note="Check the names and places, then save."}
  }catch(err){note=err.message;if(err.status==401){pass="";ls("pass","")}}
  render();
};
load();render();setInterval(()=>{if(!document.hidden)load()},8000);
</script></body></html>
