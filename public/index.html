let me=ls("me"),pass=ls("pass"),admin=ls("admin"),gid=ls("gid"),gname=ls("gname"),jn=(typeof location!="undefined"&&new URLSearchParams(location.search).get("g")||"").slice(0,24),jk="",jmsg="",admOk=false,gtier=(typeof localStorage!="undefined"&&localStorage.getItem("gtier"))||"premier",gk="",gAdm=false,ml={open:false,step:"",key:"",code:"",chal:"",email:"",msg:"",busy:false},pkList=[],pkDays=30,pkMsg="",cg={open:false,pick:"",name:"",pw:"",ak:"",ak2:"",key:"",msg:"",busy:false,done:null},tdTot=null,tdStart=0,tdAcc=null,demo=false,tryOpen=false,tryKey="",tryMsg="",tryStage="",tryRes=null,tryBusy=false,tryLeft=0,pubN=null,pubAcc=null,howto=-1,howCtx="add",scanBase="",tkList=[],tkUses=1,tkHrs=24,tkMsg="",mgG="",mgMs=null,mgD=null;

  return`<svg viewBox="0 0 300 60" width="100%" height="60"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts}"/></svg><div class="sub">Overall rating over time: ${Math.round(lo)} to ${Math.round(hi)}</div>`;
}

function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function flag(name,i){
  const n=name.trim(),known=Object.keys(D.players),l=n.toLowerCase();
  if(!n||!known.length||known.some(k=>k.toLowerCase()==l))return"";
  const lim=l.length<=4?1:2;let best=null,bd=9;
  for(const k of known){const x=lev(l,k.toLowerCase());if(x<bd){bd=x;best=k}}
  return`<div class="flag">NEW player${best&&bd<=lim?` · did you mean <button class="lnk" data-fix="${i}" data-to="${esc(best)}">${esc(best)}</button>?`:""}</div>`;
}

function goStat(k,r,m,v){if(!PREM()&&!FREEST.includes(k))return;if(!stat){sfrom=tab;sfsel=sel}stat=STATS[k]?k:"kd";srange=SR[r]?r:"all";smode=SM[m]?m:"all";ssv=v=="cur"?"cur":"best";sel="";render();scrollTo(0,0)}
function statRows(key,range,mode,sv){
  const lastT=D.matches.length?tms(D.matches[D.matches.length-1]):0,days=range=="week"?7:range=="month"?30:0,t0=days?Math.max(Date.now(),lastT)-days*DAY:-1;
  const S={},R={};
  for(const m of D.matches){const inW=!(tms(m)<=t0||(mode!="all"&&m.mode!=mode));
    if(inW)for(const x of m.results){const c=(S[x.name]??={name:x.name,k:0,d:0,n:0,sd:0,dmg:0,tk:0,tn:0,g:0,w:0,run:0,best:0,os:0,rs:0,rn:0,bs:0,bn:0});
      const op=m.results.filter(y=>y!==x).map(y=>R[y.name]??1000),oa=op.reduce((a,b)=>a+b,0)/op.length;
      c.g++;c.os+=oa;if(x.place===1){c.w++;c.run++;c.rs+=oa;c.rn++;if(c.run>c.best){c.best=c.run;c.bs=c.rs;c.bn=c.rn}}else{c.run=0;c.rs=0;c.rn=0}
      if(Number.isFinite(x.kills)&&Number.isFinite(x.deaths)){c.k+=x.kills;c.d+=x.deaths;c.n++}
      if(Number.isFinite(x.sds))c.sd+=x.sds;if(Number.isFinite(x.dmg))c.dmg+=x.dmg;
      {const od=m.results.filter(y=>y!==x&&Number.isFinite(y.dmg)).map(y=>y.dmg);if(od.length){c.tk+=od.reduce((a,b)=>a+b,0)/od.length;c.tn++}}}
    for(const x of m.results)R[x.name]=(R[x.name]??1000)+m.d.all[x.name]}
  const A=Object.values(S),L=n=>n.toLocaleString(),out=[];
  const add=(c,val,disp,sub)=>out.push({name:c.name,val,disp,sub,k:c.k,g:c.g});
  for(const c of A){
    if(key=="kd"&&c.n>=3)add(c,c.d?c.k/c.d:c.k?Infinity:0,c.d?(c.k/c.d).toFixed(2):c.k?"∞":"0.00",`${c.k} KOs · ${c.d} deaths · ${c.n} ${gms(c.n)}`);
    if(key=="kos"&&c.k>0)add(c,c.k,String(c.k),`${c.n} ${gms(c.n)} with stats`);
    if(key=="dmg"&&c.dmg>0)add(c,c.dmg,L(Math.round(c.dmg)),`${c.g} ${gms(c.g)}`);
    if(key=="sds"&&c.sd>0)add(c,c.sd,String(c.sd),`${c.g} ${gms(c.g)}`);
    if(key=="taken"&&c.tk>0)add(c,c.tk,L(Math.round(c.tk)),`${c.tn} ${gms(c.tn)} with stats`);
    if(key=="wr"&&c.g>=5)add(c,c.w/c.g,Math.round(100*c.w/c.g)+"%",`${c.w}W ${c.g-c.w}L · avg opp ${Math.round(c.os/c.g)}`);
    if(key=="streak"){const v=sv=="cur"?c.run:c.best;if(v>=2)add(c,v,String(v),sv=="cur"?`longest ${c.best} · avg opp ${Math.round(c.rs/c.rn)}`:`${c.w}W of ${c.g} · now ${c.run} · avg opp ${Math.round(c.bs/c.bn)}`)}
  }
  return out.sort((a,b)=>b.val===a.val?(b.k-a.k||b.g-a.g):b.val>a.val?1:-1);
}

const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[],d=new Date();let off=0,csz=0;
  const dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate())&0xFFFF,tm=(d.getHours()<<11|d.getMinutes()<<5|d.getSeconds()>>1)&0xFFFF;

    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);

}

async function shrink(file){
  const bm=await createImageBitmap(file).catch(()=>{throw new Error("Couldn't open that image. Try a screenshot or a JPEG/PNG photo.")}),s=Math.min(1,1568/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=bm.width*s;c.height=bm.height*s;
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.92).split(",")[1];
}

  render();
};

async function cgSubmit(){
  const prem=cg.pick=="premier",n=cg.name.trim(),pw=cg.pw.trim(),ak=cg.ak.trim();
  if(prem&&cg.key.replace(/[^a-z0-9]/gi,"").length<8)return cgMsg("Enter your Premier group key.");
  if(n.length<2)return cgMsg("Group name must be 2 to 24 characters.");
  if(pw.length<4)return cgMsg("Group password must be at least 4 characters.");
  if(ak.length<4)return cgMsg("Admin password must be at least 4 characters.");
  if(ak!==cg.ak2.trim())return cgMsg("The admin passwords do not match.");
  if(ak===pw)return cgMsg("The admin password must be different from the group password.");
  cg.busy=true;cg.msg="Creating…";render();
  try{
    const j=await api("groups",{method:"POST",body:JSON.stringify(prem?{action:"create",maker:cg.key.trim(),name:n,passkey:pw,adminKey:ak}:{action:"signup",name:n,passkey:pw,adminKey:ak})});
    cg.done={id:j.id,name:n,pw,ak,tier:prem?"premier":"free"};cg.msg=""}
  catch(e){cg.msg=e.message}
  cg.busy=false;render();
}

async function tryCheck(){
  if(!tryKey.trim()){tryMsg="Enter your scan key.";return render()}
  tryBusy=true;tryMsg="Checking…";render();
  try{const r=await fetch("/api/trykeys",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"check",key:tryKey})}),j=await r.json().catch(()=>({}));

    tryLeft=j.left;tryStage="scan";tryMsg="";tryRes=null}
  catch(e){tryMsg=e.message}

}
function tryExit(){tryStage="";tryRes=null;tryMsg="";tryBusy=false;render()}
function tryPage(){
  if(tryStage=="scan")return`<div class="card"><b>Try scan</b><div class="msg">Pick a screenshot or photo of a Super Smash Bros. results screen. It is read and shown to you, and nothing is saved.</div><div class="row"><button style="flex:1" ${tryBusy?"disabled":""} onclick="document.getElementById('tf').click()">📷 Choose picture</button><button class="g q" aria-label="How to scan" title="How to scan" onclick="showHow('try')">?</button></div><div class="sub">${tryLeft} scan${tryLeft==1?"":"s"} left on this key</div><div class="msg${wc(tryMsg)}">${esc(tryMsg)}</div><div class="row"><button class="g" onclick="tryExit()">Back</button></div></div>`;
  if(tryStage=="review")return`<div class="card"><b>Is this right?</b><div class="msg">Here's what the scan read. Accept it to see the finished results.</div>${tryList().map(p=>`<div class="row" style="margin:8px 0"><span class="rk">${ord(p.place)}</span><span class="nm">${esc(p.name)}${p.character?` <span class="sub">${esc(p.character)}</span>`:""}</span></div>`).join("")}<div class="row"><button style="flex:1" onclick="tryStage='result';render();scrollTo(0,0)">Accept scan</button></div><div class="row"><button class="g" ${tryLeft>0?"":"disabled"} onclick="tryStage='scan';tryMsg='';render()">Scan again</button><button class="g" onclick="tryExit()">Cancel</button></div></div>`;
  const L=tryList(),groups=[];L.forEach(p=>{const g=groups.find(x=>x.place==p.place);g?g.p.push(p):groups.push({place:p.place,p:[p]})});
  return`<div class="card" style="background:var(--yel)"><div class="big">✓ The scan worked</div><div class="msg" style="margin:0">Here are the results it read from your picture. Nothing was saved.</div></div>`+
  groups.map(g=>`<div class="card pl p${Math.min(g.place,4)}"><div class="o">${g.place<=3?medal(g.place-1,30):""}<div>${ord(g.place)}</div></div><div class="who">${g.p.map(p=>`<div style="margin-bottom:6px"><b>${esc(p.name)}</b>${p.character?`<div class="sub">${esc(p.character)}</div>`:""}${statChips(p)}</div>`).join("")}</div></div>`).join("")+
  `<div class="row"><button style="flex:1" onclick="tryExit()">Done</button></div><div class="msg">Want this for your own group? Text ${PHONE}.</div>`;
}
function tryList(){const pl=(tryRes||[]).map((p,i)=>({...p,place:+p.place||i+1,_i:i}));return pl.sort((a,b)=>a.place-b.place||a._i-b._i)}
function statChips(p){const c=[["KOs",p.kills],["Falls",p.deaths],["SDs",p.sds],["Damage",p.damage]].filter(([,v])=>Number.isFinite(v));return c.length?`<div class="chips">${c.map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}</div>`:""}

const HOW=[

function showHow(ctx){howCtx=ctx;howto=0;drawHow()}
function drawHow(){
  const o=document.getElementById("ov");if(!o)return;
  if(howto<0){o.style.display="none";o.innerHTML="";return}
  const s=HOW[howto],last=howto==HOW.length-1,body=s[1]??(howCtx=="try"?"Make sure the names and placements match your picture, then tap Accept scan to see the finished results.":"Make sure every name, placement and stat matches the screen. Fix anything that's off. A popup asks if all data is correct: tap Yes, save to log the match, or No, edit to keep fixing it first.");
  o.style.display="flex";
  o.innerHTML=`<div class="box" role="dialog" aria-label="How to scan"><button class="cl" aria-label="Close" title="Close" onclick="howto=-1;drawHow()">✕</button><div class="dots">${HOW.map((_,i)=>`<i class="${i==howto?"on":""}"></i>`).join("")}</div><div class="big">${howto+1}. ${esc(s[0])}</div><div class="msg" style="margin:0 0 14px">${body}</div><div class="row">${howto>0?`<button class="g" onclick="howto--;drawHow()">Back</button>`:`<button class="g" onclick="howto=-1;drawHow()">Close</button>`}<button style="flex:1" onclick="${last?"howto=-1":"howto++"};drawHow()">${last?"Got it":"Next"}</button></div></div>`;
}

// ---------- Demo group ----------
function makeDemo(){
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const pl=[["Pixel",1.6,"Kirby"],["Nova",1.3,"Fox"],["Rook",1,"Link"],["Echo",.8,"Pikachu"],["Bolt",.6,"Mario"],["Mango",.4,"Samus"]],DAY=864e5,now=Date.now(),out=[];
  for(let i=0;i<64;i++){
    const n=rnd()<.55?2:rnd()<.5?3:4,pool=pl.slice().sort(()=>rnd()-.5).slice(0,n);
    const sc=pool.map(p=>({p,v:p[1]*(.5+rnd())})).sort((a,b)=>b.v-a.v),stats=rnd()<.8;
    out.push({id:"demo"+i,ts:new Date(now-(40*DAY)*(1-i/64)).toISOString(),results:sc.map((x,k)=>({name:x.p[0],place:k+1,char:rnd()<.8?x.p[2]:["Fox","Link","Mario","Kirby","Ness"][Math.floor(rnd()*5)],...(rnd()<.07?{rnd:true,char:"Random"}:{}),...(stats?{kills:Math.max(0,Math.round((n-k)*1.4+rnd()*3-1)),deaths:Math.max(0,Math.round(k*1.5+rnd()*2)),sds:rnd()<.15?1:0,dmg:Math.round(60+rnd()*140+(n-k)*25)}:{})}))});
  }
  return out;
}
function startDemo(){demo=true;gid="demo";gname="Demo Squad";pass="";ms=makeDemo();ms.sort((a,b)=>new Date(a.ts)-new Date(b.ts));tab="lb";sel="";stat="";tryOpen=false;tryStage="";render();scrollTo(0,0)}
