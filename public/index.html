<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Smash ELO">
<meta name="theme-color" content="#fff6d6"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<title>Smash ELO</title>
<style>
:root{--bg:#fff6d6;--card:#fffdf4;--tx:#1b1730;--ink:#1b1730;--mu:#6b6590;--ac:#e5322d;--ok:#13813a;--bad:#c41e3a;--ln:#d9cfa3;--in:#fff;--g:#ffe9a8;--blue:#2f6bff;--yel:#ffd23f;--pf:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(27,23,48,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(27,23,48,.05) 1px,transparent 1px);background-size:16px 16px;color:var(--tx);font:15px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:20px/1.3 var(--pf);margin:6px 0 4px;color:var(--ink);text-shadow:3px 3px 0 var(--yel)}h1 span{color:var(--ac)}
.tl{font:8px/1.6 var(--pf);color:var(--mu);margin:0 0 16px}
.blink{animation:bl 1s steps(2,start) infinite}@keyframes bl{to{visibility:hidden}}
.card{background:var(--card);border:3px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--ink);padding:12px;margin:0 4px 16px 0}
.card>b,.ct,summary>b{font:10px/1.6 var(--pf);text-transform:uppercase;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input,select{background:var(--in);color:var(--tx);border:3px solid var(--ink);border-radius:0;padding:9px;font:inherit;min-width:0;max-width:100%}
input:focus,select:focus{outline:3px solid var(--blue);outline-offset:0}
input.n{flex:1}input.p{width:64px;text-align:center}
button{background:var(--ac);color:#fff;border:3px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--ink);padding:10px 12px;font:9px/1.4 var(--pf);cursor:pointer}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
button:disabled{opacity:.5}
button.g{background:var(--yel);color:var(--ink)}
button.x{background:none;border:0;box-shadow:none;color:var(--mu);padding:6px 10px;font-size:12px}
button.lnk{background:none;border:0;box-shadow:none;color:var(--ac);padding:0;text-decoration:underline;font:inherit;font-weight:700}
.seg{display:flex;gap:6px;margin:0 4px 14px 0}.seg button{flex:1;background:#fff;color:var(--ink);padding:10px 2px;font-size:8px;white-space:nowrap}.seg button.on{background:var(--blue);color:#fff}.seg button.srch{flex:0 0 46px;padding:8px 0;font-size:14px}.seg button.srch.on{background:var(--ac)}
.lb{display:flex;align-items:center;gap:10px;cursor:pointer}.rk{width:28px;display:inline-flex;justify-content:center;align-items:center;color:var(--mu);font:10px var(--pf)}
.nm{flex:1;font-weight:700;min-width:0}.sub{color:var(--mu);font-size:13px}.elo{font:15px/1.3 var(--pf)}
.tri{display:flex;justify-content:space-around;text-align:center;margin-top:8px}.tri .elo{font-size:14px}
.up{color:var(--ok)}.dn{color:var(--bad)}.msg{color:var(--mu);font-size:14px;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;box-shadow:none;color:var(--mu);padding:16px 0 14px;font-size:8px}
nav button.on{color:var(--ac);box-shadow:inset 0 -4px 0 var(--ac)}nav button:active{transform:none}
.flag{font-size:13px;color:var(--ac);margin:-4px 0 8px 72px;font-weight:700}
.tag{display:inline-block;font:8px/1.4 var(--pf);color:var(--ink);background:var(--yel);border:2px solid var(--ink);padding:2px 5px;margin-left:6px;vertical-align:middle}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.pair .elo{margin:6px 0 4px}
.mn{font-size:14px;font-weight:700;word-break:break-word}
details summary{cursor:pointer}
input.sm{flex:1;width:0;min-width:0;text-align:center;padding:8px 4px}
.med{vertical-align:middle;image-rendering:pixelated}
.medals{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font:8px var(--pf)}.mb{display:inline-flex;align-items:center;gap:4px}
.mv{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}.mv .dl{font:11px var(--pf);white-space:nowrap}.mv .rc{font-size:12px;color:var(--mu);min-width:62px;text-align:right}
.bar{height:12px;margin-top:4px;background:repeating-linear-gradient(90deg,var(--blue) 0 6px,transparent 6px 8px)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:10px 0 8px;min-height:130px}
.slot{flex:1;min-width:0;max-width:33%;text-align:center}
.slot .pn{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .pr{font:12px var(--pf);margin:6px 0 2px}.slot .pd{font-size:12px;font-weight:700;margin-bottom:6px}
.blk{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.b0{height:46px;background:#ffd23f}.b1{height:32px;background:#c9ced8}.b2{height:22px;background:#d9894a}
.pod.list{display:block;min-height:0}.sb{display:flex;align-items:center;gap:6px;margin:5px 0}.sb .rk{width:22px}.sb .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sb .pr{font:11px var(--pf)}.sb .pd{font-size:12px;font-weight:700;min-width:56px;text-align:right}
.seg.w{flex-wrap:wrap}.seg.w button{flex:1 0 28%}[data-stat]{cursor:pointer}.pod.mini{min-height:0;margin:8px 0 2px}.mini .b0{height:28px}.mini .b1{height:18px}.mini .b2{height:10px}.mini .slot .pr{font-size:10px}.sw{display:inline-block;width:9px;height:9px;border:2px solid var(--ink);margin-right:4px}
#now{display:none;align-items:center;gap:6px 10px;flex-wrap:wrap;margin:0 4px 16px 0;background:var(--yel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:9px 11px}
#now .live{font:8px/1.5 var(--pf);color:var(--ink);white-space:nowrap}#now .who{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}#now .ago{font-size:12px;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;background:var(--ac);border:2px solid var(--ink);margin-right:6px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style></head><body><main><h1>SMASH <span>ELO</span></h1><div class="tl">▶ 1UP LEADERBOARD <span class="blink">█</span></div><div id="now"></div><div id="v"></div></main>
<nav><button data-t="lb">Ranks</button><button data-t="tr">Trends</button><button data-t="add">Add</button><button data-t="hist">History</button><button data-t="set">Settings</button></nav>
<input type="file" id="f" accept="image/*" hidden>
<script src="/elo.js"></script>
<script>
const LB={all:"Overall",one:"1v1",ffa:"FFA"};
const FIGHTERS="Mario,Donkey Kong,Link,Samus,Dark Samus,Yoshi,Kirby,Fox,Pikachu,Luigi,Ness,Captain Falcon,Jigglypuff,Peach,Daisy,Bowser,Ice Climbers,Sheik,Zelda,Dr. Mario,Pichu,Falco,Marth,Lucina,Young Link,Ganondorf,Mewtwo,Roy,Chrom,Mr. Game & Watch,Meta Knight,Pit,Dark Pit,Zero Suit Samus,Wario,Snake,Ike,Pokémon Trainer,Diddy Kong,Lucas,Sonic,King Dedede,Olimar,Lucario,R.O.B.,Toon Link,Wolf,Villager,Mega Man,Wii Fit Trainer,Rosalina & Luma,Little Mac,Greninja,Mii Brawler,Mii Swordfighter,Mii Gunner,Palutena,Pac-Man,Robin,Shulk,Bowser Jr.,Duck Hunt,Ryu,Ken,Cloud,Corrin,Bayonetta,Inkling,Ridley,Simon,Richter,King K. Rool,Isabelle,Incineroar,Piranha Plant,Joker,Hero,Banjo & Kazooie,Terry,Byleth,Min Min,Steve,Sephiroth,Pyra/Mythra,Kazuya,Sora".split(",");
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k)||"":localStorage.setItem(k,v)}catch(e){return""}};
let ms=[],tab="lb",board="all",sel="",draft=[{name:"",place:1},{name:"",place:2}],note="",D=null;
let me=ls("me"),pass=ls("pass"),admin=ls("admin");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sg=x=>(x>=0?"+":"")+x.toFixed(1);
const api=async(p,o={})=>{const r=await fetch("/api/"+p,{headers:{"content-type":"application/json"},...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Something went wrong"),{status:r.status});return j};
function updateNow(){
  const el=document.getElementById("now");if(!el)return;
  const t=Date.now(),at=m=>new Date(m.ts).getTime(),recent=ms.filter(m=>t-at(m)<=300000).sort((a,b)=>at(b)-at(a));
  if(!recent.length){el.innerHTML="";el.style.display="none";return}
  const names=[];for(const m of recent)for(const x of m.results)if(!names.includes(x.name))names.push(x.name);
  const mins=Math.max(0,Math.floor((t-at(recent[0]))/60000)),shown=names.slice(0,6),more=names.length-shown.length;
  el.style.display="flex";
  el.innerHTML=`<span class="live"><i class="dot blink"></i>PLAYING NOW</span><span class="who">${shown.map(esc).join(", ")}${more>0?` +${more} more`:""}</span><span class="ago">${mins<1?"just now":mins+" min ago"}</span>`;
}
async function load(){try{ms=await api("matches");ms.sort((a,b)=>new Date(a.ts)-new Date(b.ts));updateNow();const ae=document.activeElement?.tagName;if(tab!="add"&&ae!="SELECT"&&ae!="INPUT")render();else D=ELO.compute(ms)}catch(e){}}
function spark(h){
  if(h.length<2)return"";const v=h.map(x=>x.r),lo=Math.min(...v),hi=Math.max(...v),sp=Math.max(hi-lo,1);
  const pts=v.map((y,i)=>`${(i/(v.length-1)*296+2).toFixed(1)},${(56-(y-lo)/sp*52).toFixed(1)}`).join(" ");
  return`<svg viewBox="0 0 300 60" width="100%" height="60"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts}"/></svg><div class="sub">Overall rating over time: ${Math.round(lo)} to ${Math.round(hi)}</div>`;
}
const tri=p=>`<div class="tri">${["all","one","ffa"].map(t=>`<div><div class="elo">${p.g[t]?Math.round(p.r[t]):"—"}</div><div class="sub">${LB[t]}</div></div>`).join("")}</div>`;
function render(){
  raceStop();D=ELO.compute(ms);const P=D.players,v=document.getElementById("v");CH=[...new Set([...FIGHTERS,...ms.flatMap(m=>m.results.map(x=>x.char).filter(Boolean))])].sort();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
  if(stat&&!(sel&&P[sel])&&(tab=="lb"||tab=="tr")){v.innerHTML=statPage();return}
  if(tab=="lb"){
    if(sel&&P[sel]){v.innerHTML=playerPage(P[sel]);return}
    let h="";

    if(me&&P[me])h+=`<div class="card" data-n="${esc(me)}"><div class="sub">You · ${esc(me)}</div>${triP(P[me])}</div>`;


    const q=fq.trim().toLowerCase();
    h+=`<div class="seg">${Object.keys(LB).map(t=>`<button class="${board==t?"on":""}" onclick="board='${t}';render()">${LB[t]}</button>`).join("")}<button class="srch${sopen?" on":""}" aria-label="Search players" onclick="${sopen?"sopen=false;fq='';render()":"sopen=true;render();document.getElementById('fq').focus()"}">${sopen?"✕":"🔍"}</button></div>`;
    if(sopen)h+=`<div class="row"><input class="n" id="fq" placeholder="Search player" value="${esc(fq)}" oninput="fq=this.value;render();const e=document.getElementById('fq');e.focus();e.setSelectionRange(fq.length,fq.length)"></div>`;
    const full=boardList(board),L=full.filter(p=>!q||p.name.toLowerCase().includes(q));
    h+=L.length?L.map(p=>{const i=full.indexOf(p);return`<div class="card lb" data-n="${esc(p.name)}"><div class="rk">${i<3?medal(i):i+1}</div><div class="nm">${esc(p.name)} ${p.streak>=2?"🔥"+p.streak:""}<div class="sub">${p.g[board]} games${prov(p.g[board])}</div></div><div class="elo">${Math.round(p.r[board])}</div></div>`}).join(""):`<p class="msg">No ${LB[board]} matches${q?" for that search":" yet"}.</p>`;
    if(ms.length&&!q)h+=podiums();
    v.innerHTML=h;
  }
  if(tab=="tr"){v.innerHTML=trendsPage();raceStart()}
  if(tab=="add"){
    if(!pass){v.innerHTML=`<div class="card"><b>Group passcode</b><div class="msg">Ask the group admin for the passcode to add matches.</div><div class="row"><input class="n" type="password" id="pc" placeholder="Passcode"><button onclick="pass=document.getElementById('pc').value.trim();ls('pass',pass);render()">Save</button></div></div>`;return}
    v.innerHTML=`<datalist id="dl">${Object.keys(P).map(n=>`<option value="${esc(n)}">`).join("")}</datalist><datalist id="dlc">${CH.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="card"><button class="g" style="width:100%" onclick="document.getElementById('f').click()">📷 Scan result screen</button><div class="msg" id="st">${esc(note)}</div></div>
    <div class="card">${draft.map((r,i)=>`<div class="row"><input class="p" type="number" min="1" max="8" value="${r.place}" onchange="draft[${i}].place=+this.value||1" aria-label="Place"><input class="n" list="dl" placeholder="Username" value="${esc(r.name)}" onchange="draft[${i}].name=this.value"><button class="x" onclick="draft.splice(${i},1);render()">✕</button></div>${flag(r.name,i)}<div class="row" style="margin:-2px 0 6px 72px"><input class="n" list="dlc" placeholder="Character (optional)" value="${esc(r.char||"")}" onchange="draft[${i}].char=this.value"></div><div class="row" style="margin:0 0 10px 72px;gap:6px">${[["kills","KOs"],["deaths","Deaths"],["sds","SDs"],["dmg","Dmg"]].map(([k,t])=>`<input class="sm" type="number" inputmode="decimal" min="0" placeholder="${t}" value="${r[k]??""}" onchange="draft[${i}].${k}=nv(this.value)" aria-label="${t}">`).join("")}</div>`).join("")}
    <div class="row"><button class="g" onclick="if(draft.length<8){draft.push({name:'',place:draft.length+1});render()}">+ Player</button><button id="sv" style="flex:1" onclick="saveMatch()">Save match</button></div>
    <div class="msg">Place 1 = winner. Tied players share a number. 2 players = 1v1, 3 or more = FFA.</div></div>`;
  }
  if(tab=="hist"){
    v.innerHTML=ms.length?D.matches.slice().reverse().map(m=>`<div class="card"><div class="row"><span class="sub" style="flex:1">${new Date(m.ts).toLocaleString()} · ${LB[m.mode]}</span>${admin?`<button class="x" onclick="del('${esc(m.id)}')">Delete</button>`:""}</div>${m.results.slice().sort((a,b)=>a.place-b.place).map(x=>`<div class="row" style="margin:2px 0"><span class="rk">${x.place}</span><span class="nm">${esc(x.name)}${x.char?` <span class="sub">${esc(x.char)}</span>`:""}</span><span class="${m.d.mode[x.name]>=0?"up":"dn"}">${LB[m.mode]} ${sg(m.d.mode[x.name])}</span><span class="sub">All ${sg(m.d.all[x.name])}</span></div>`).join("")}</div>`).join(""):`<p class="msg">No matches yet.</p>`;
  }
  if(tab=="set"){
    v.innerHTML=`<div class="card"><b>Group passcode</b><div class="row" style="margin-top:8px"><input class="n" type="password" value="${esc(pass)}" onchange="pass=this.value.trim();ls('pass',pass)"></div></div>
    <div class="card"><b>Admin passcode</b><div class="msg">Only needed to delete matches.</div><div class="row"><input class="n" type="password" value="${esc(admin)}" onchange="admin=this.value.trim();ls('admin',admin)"></div></div>
    <div class="card"><b>You are</b><div class="row" style="margin-top:8px"><select onchange="me=this.value;ls('me',me)"><option value="">Choose…</option>${Object.keys(P).sort().map(n=>`<option ${n==me?"selected":""}>${esc(n)}</option>`).join("")}</select></div></div>
    <div class="card"><button class="g" onclick="csv()">Export matches (CSV)</button></div>${mergeCard(P)}`;
  }
}
document.querySelector("nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;sel="";stat="";if(tab=="tr")RACE.key="";if(tab!="lb"){sopen=false;fq=""}render()}};
document.getElementById("v").onclick=e=>{const sc=e.target.closest("[data-stat]");if(sc){goStat(sc.dataset.stat,sc.dataset.sr,sc.dataset.sm,sc.dataset.sv);return}const k=e.target.closest("[data-ch]");if(k){pchar=pchar==k.dataset.ch?"":k.dataset.ch;render();return}const f=e.target.closest("[data-fix]");if(f){draft[+f.dataset.fix].name=f.dataset.to;render();return}const c=e.target.closest("[data-n]");if(c&&(tab=="lb"||tab=="tr")){tab="lb";sel=c.dataset.n;pchar="";render();scrollTo(0,0)}};
let mg={from:"",to:""},mgOut="",mgOk=false,CH=[],fchar="",fq="",sopen=false,pchar="",pmode="all",prange="all";
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function flag(name,i){
  const n=name.trim(),known=Object.keys(D.players),l=n.toLowerCase();
  if(!n||!known.length||known.some(k=>k.toLowerCase()==l))return"";
  const lim=l.length<=4?1:2;let best=null,bd=9;
  for(const k of known){const x=lev(l,k.toLowerCase());if(x<bd){bd=x;best=k}}
  return`<div class="flag">NEW player${best&&bd<=lim?` · did you mean <button class="lnk" data-fix="${i}" data-to="${esc(best)}">${esc(best)}</button>?`:""}</div>`;
}
function mergeCard(P){
  if(!admin)return"";
  const names=Object.keys(P).sort(),opt=v=>`<option value="">Choose…</option>`+names.map(n=>`<option ${n==v?"selected":""}>${esc(n)}</option>`).join("");
  return`<div class="card"><b>Merge players</b><div class="msg">Moves all matches from the first name into the second. A backup CSV downloads first.</div><div class="row"><select onchange="mg.from=this.value;mgOut='';mgOk=false">${opt(mg.from)}</select><span class="sub">into</span><select onchange="mg.to=this.value;mgOut='';mgOk=false">${opt(mg.to)}</select></div><button class="g" onclick="previewMerge()">Preview</button><div class="msg">${mgOut}</div>${mgOk?`<button onclick="doMerge()">Merge now</button>`:""}</div>`;
}
function previewMerge(){
  const {from,to}=mg;if(!from||!to||from==to)return alert("Pick two different players.");
  const fl=from.toLowerCase(),tl=to.toLowerCase();let changed=0;const conf=[];
  const nm=ms.map(m=>{
    if(!m.results.some(x=>x.name.toLowerCase()==fl))return m;
    changed++;if(fl!=tl&&m.results.some(x=>x.name.toLowerCase()==tl))conf.push(m);
    return{...m,results:m.results.map(x=>x.name.toLowerCase()==fl?{...x,name:to}:x)};
  });
  if(conf.length){mgOk=false;mgOut=`<span class="dn">Can't merge: ${conf.length} match(es) include both players (${conf.slice(0,5).map(m=>new Date(m.ts).toLocaleDateString()).join(", ")}). Delete or fix them in History first.</span>`}
  else{
    const B=D.players[to],A=ELO.compute(nm).players[to];mgOk=true;
    mgOut=`${changed} match(es) will be renamed. ${esc(to)} before → after: ${["all","one","ffa"].map(t=>`${LB[t]} ${B.g[t]?Math.round(B.r[t]):"—"} → ${A.g[t]?Math.round(A.r[t]):"—"}`).join(" · ")}`;
  }
  render();
}
async function doMerge(){
  const {from,to}=mg;
  if(!confirm(`Merge ${from} into ${to}? A backup CSV will download first. This can't be undone from the app.`))return;
  csv();
  try{
    await api("matches",{method:"POST",body:JSON.stringify({action:"merge",admin,from,to})});
    if(me==from){me=to;ls("me",me)}
    mg={from:"",to:""};mgOut="Merged.";mgOk=false;await load();render();
  }catch(e){alert(e.message)}
}
let psort="best";
const pct=(w,l)=>w+l?Math.round(100*w/(w+l))+"%":"—";
const gm=r=>r.w+r.l+r.t,wr=r=>(r.w+.5*r.t)/gm(r),rec=r=>`${r.w}–${r.l}${r.t?"–"+r.t:""}`;
const prov=g=>g&&g<10?`<span class="tag">provisional</span>`:"";
const triP=p=>`<div class="tri">${["all","one","ffa"].map(t=>`<div><div class="elo">${p.g[t]?Math.round(p.r[t]):"—"}</div><div class="sub">${LB[t]}</div>${prov(p.g[t])}</div>`).join("")}</div>`;
function avgCard(P){
  const ps=Object.values(P);if(!ps.length)return"";

  const X=t=>26+(t-T.t0)/(T.t1-T.t0)*264,Y=v=>118-(v-(lo-pad))/(sp+2*pad)*108;
  RACE.g={t0:T.t0,t1:T.t1,X,Y,hs:all?5:6};
  const k=days==7?7:5,fmt=d=>d.toLocaleDateString(undefined,days==7?{weekday:"short"}:{month:"numeric",day:"numeric"});
  const ticks=Array.from({length:k+1},(_,i)=>T.t0+i*(T.t1-T.t0)/k).map(t=>`<line x1="${X(t).toFixed(1)}" y1="118" x2="${X(t).toFixed(1)}" y2="122" stroke="var(--ink)"/><text x="${X(t).toFixed(1)}" y="134" text-anchor="middle" font-size="8" style="fill:var(--mu)">${fmt(new Date(t))}</text>`).join("");
  const yl=[hi,(hi+lo)/2,lo].map(v=>`<text x="2" y="${(Y(v)+3).toFixed(1)}" font-size="8" style="fill:var(--mu)">${Math.round(v)}</text><line x1="26" y1="${Y(v).toFixed(1)}" x2="290" y2="${Y(v).toFixed(1)}" stroke="var(--ln)" stroke-dasharray="2 3"/>`).join("");
  const lines=RACE.s.map((s,i)=>`<polyline id="rl${i}" fill="none" stroke="${s.col}" stroke-width="${all?2:3}" stroke-linejoin="miter" shape-rendering="crispEdges" points=""/>`).join(""),heads=RACE.s.map((s,i)=>`<rect id="rh${i}" width="${all?5:6}" height="${all?5:6}" fill="${s.col}" stroke="var(--ink)" stroke-width="1"/>`).join("");
  return`<div class="card"><div class="row"><b class="ct" style="flex:1">Rating race</b><button class="g" onclick="replayRace()">▶ Replay</button></div><div class="seg" style="margin:4px 0 8px"><button class="${all?"":"on"}" onclick="rview='top3';render()">Podium race</button><button class="${all?"on":""}" onclick="rview='top5';render()">Top 5</button></div><div class="sub" id="rt">&nbsp;</div><div class="pod${all?" list":""}" id="pod"></div><svg viewBox="0 0 300 140" width="100%" role="img" aria-label="Rating of the top three players over the last ${days} days"><line x1="26" y1="118" x2="290" y2="118" stroke="var(--ink)"/>${yl}${ticks}${lines}${heads}</svg></div>`;
}
function trendsPage(){
  const days=tper=="week"?7:30,w=tper,T=trendsData(days),R0=Math.round;
  const seg=`<div class="seg"><button class="${tper=="week"?"on":""}" onclick="tper='week';render()">Week</button><button class="${tper=="month"?"on":""}" onclick="tper='month';render()">Month</button></div>`;
  RACE.g=null;RACE.s=[];
  if(!T.inP.length)return seg+`<div class="card"><b>Quiet here</b><div class="msg">No matches in the last ${days} days.</div></div>`;
  const cf=(t,r,good)=>`<div class="card"${r?` data-n="${esc(r.name)}" style="cursor:pointer"`:""}><div class="ct">${t}</div>${r?`<div class="nm" style="margin-top:8px">${esc(r.name)}</div><div class="elo ${good?"up":"dn"}">${r.d>=0?"+":""}${R0(r.d)}</div><div class="sub">${R0(r.s)} → ${R0(r.e)} · ${r.n} games</div>`:`<div class="sub" style="margin-top:8px">Nobody yet (needs 2+ games)</div>`}</div>`;
  const mv=T.rows.map(r=>{const d=R0(r.d),rc=r.rs==null?"NEW":r.rs-r.rn>0?"▲"+(r.rs-r.rn):r.rs-r.rn<0?"▼"+(r.rn-r.rs):"–";return`<div class="mv" data-n="${esc(r.name)}"><span class="rk">${r.rn<=3?medal(r.rn-1,20):r.rn}</span><span class="nm">${esc(r.name)}<div class="sub">${r.n} game${r.n>1?"s":""} · now ${R0(r.e)}</div></span><span class="dl ${d>0?"up":d<0?"dn":""}">${d>0?"▲":d<0?"▼":"–"} ${Math.abs(d)}</span><span class="rc">#${r.rn} ${rc}</span></div>`}).join("");
  const mx=Math.max(...T.active.map(r=>r.n));
  const act=T.active.map(r=>`<div style="margin:8px 0" data-n="${esc(r.name)}"><div class="row" style="margin:0"><span class="nm">${esc(r.name)}</span><span class="sub">${r.n} games · ${r.opp} opponent${r.opp==1?"":"s"}</span></div><div class="bar" style="width:${Math.max(4,r.n/mx*100)}%"></div></div>`).join("");
  const st=(T.cur.length?T.cur.map(p=>`<div class="row" style="margin:6px 0" data-stat="streak" data-sv="cur" data-sr="all"><span class="nm">🔥 ${esc(p.name)}</span><span class="elo up">${p.streak}</span><span class="sub">in a row</span></div>`).join(""):`<div class="sub">No active streaks of 2 or more.</div>`)+(T.longest?`<div class="sub" style="margin-top:8px" data-stat="streak" data-sv="best" data-sr="${tper}">Longest this ${w}: <b>${esc(T.longest.name)}</b> · ${T.longest.n} wins in a row ›</div>`:"");
  const u=T.upset,up=u?`<div class="nm" style="margin-top:8px"><span class="up">${esc(u.name)}</span> beat ${esc(u.opp)}</div><div class="sub">${u.mc||u.oc?`${esc(u.mc||"?")} vs ${esc(u.oc||"?")} · `:""}rated ${R0(u.gap)} lower · only a ${R0(u.pr*100)}% chance · ${new Date(u.ts).toLocaleDateString()}</div>`:`<div class="sub" style="margin-top:8px">No upsets this ${w}. An upset needs a 50+ point rating gap.</div>`;
  const rv=T.rival,riv=rv?`<div class="nm" style="margin-top:8px">${esc(rv.a)} vs ${esc(rv.b)}</div><div class="sub">${rv.n} meetings · ${rv.aw}–${rv.bw}${rv.t?"–"+rv.t:""} (${esc(rv.a)} first)</div>`:`<div class="sub" style="margin-top:8px">No rivalries yet.</div>`;
  const lr=t=>{const L=T.lead[t];if(!L.cur)return`<div class="row" style="margin:8px 0"><span class="sub" style="flex:0 0 52px">${LB[t]}</span><span class="sub">No games yet</span></div>`;
    const note=!L.prev?"new board":L.prev==L.cur.name?"held the lead":`took the lead from ${esc(L.prev)}`;
    return`<div class="row" data-n="${esc(L.cur.name)}" style="margin:8px 0;cursor:pointer"><span class="sub" style="flex:0 0 52px">${LB[t]}</span><span class="rk">${medal(0,18)}</span><span class="nm">${esc(L.cur.name)}<div class="sub">${note}</div></span><span class="elo">${R0(L.cur.r[t])}</span></div>`};
  const leadCard=`<div class="card"><b>Rating leaders</b>${lr("one")}${lr("ffa")}</div>`;
  const C=T.cmb,cr=(label,key,c,val,sub)=>c?`<div class="row" data-stat="${key}" data-sr="${tper}" style="margin:8px 0"><span class="sub" style="flex:0 0 96px">${label}</span><span class="nm">${esc(c.name)}${sub?`<div class="sub">${sub}</div>`:""}</span><span class="elo">${val}</span><span class="sub">›</span></div>`:`<div class="row" style="margin:8px 0"><span class="sub" style="flex:0 0 96px">${label}</span><span class="sub">—</span></div>`;
  const cmbCard=C.any?`<div class="card"><b>Combat leaders</b><div class="msg">Only matches with stats recorded count. Best K/D needs 3+. Tap a stat to see everyone ranked.</div>${cr("Best K/D","kd",C.kd,C.kd&&(C.kd.kd===Infinity?"∞":C.kd.kd.toFixed(2)),C.kd&&`${C.kd.k} KOs · ${C.kd.d} deaths · ${C.kd.n} games`)}${cr("Most KOs","kos",C.kos,C.kos&&C.kos.k)}${cr("Most damage","dmg",C.dmg,C.dmg&&Math.round(C.dmg.dmg).toLocaleString())}${cr("Most SDs","sds",C.sds,C.sds&&C.sds.sd)}</div>`:`<div class="card"><b>Combat leaders</b><div class="msg">No stats recorded in the last ${days} days. Scan the second results screen, or type KOs, deaths, SDs, and damage when you add a match.</div></div>`;
  return seg+raceCard(T,days)+`<div class="pair">${cf("Top climber",T.climber,true)}${cf("Biggest drop",T.faller,false)}</div><div class="card"><b>Who's moving</b><div class="msg">Rating change over the last ${days} days. Tap a player for their page.</div>${mv}</div><div class="card"><b>Most active</b>${act}</div><div class="card"><b>Hot streaks</b><div style="margin-top:6px">${st}</div></div>${leadCard}${cmbCard}<div class="card"><b>Upset of the ${w}</b>${up}</div><div class="card"><b>Rivalry of the ${w}</b>${riv}</div>`;
}

// ---------- Stat ranking pages ----------
const STATS={kd:{c:"K/D",t:"K/D ratio",d:"Kills per death. Needs 3+ games with stats."},kos:{c:"KOs",t:"Most KOs",d:"Total kills."},dmg:{c:"Damage",t:"Most damage",d:"Total damage dealt."},sds:{c:"SDs",t:"Most SDs",d:"Total self-destructs."},streak:{c:"Streak",t:"Win streaks",d:"Wins in a row. Avg opp = average rating of the opponents in that streak."},wr:{c:"Win %",t:"Win rate",d:"Needs 5+ games. Avg opp = average rating of opponents faced."}};
const SR={week:"Week",month:"Month",all:"All time"},SM={all:"Overall",one:"1v1",ffa:"FFA"};
let stat="",sfrom="lb",sfsel="",srange="all",smode="all",ssv="best";
function goStat(k,r,m,v){if(!stat){sfrom=tab;sfsel=sel}stat=STATS[k]?k:"kd";srange=SR[r]?r:"all";smode=SM[m]?m:"all";ssv=v=="cur"?"cur":"best";sel="";render();scrollTo(0,0)}
function statRows(key,range,mode,sv){
  const lastT=D.matches.length?tms(D.matches[D.matches.length-1]):0,days=range=="week"?7:range=="month"?30:0,t0=days?Math.max(Date.now(),lastT)-days*DAY:-1;
  const S={},R={};
  for(const m of D.matches){const inW=!(tms(m)<=t0||(mode!="all"&&m.mode!=mode));
    if(inW)for(const x of m.results){const c=(S[x.name]??={name:x.name,k:0,d:0,n:0,sd:0,dmg:0,g:0,w:0,run:0,best:0,os:0,rs:0,rn:0,bs:0,bn:0});
      const op=m.results.filter(y=>y!==x).map(y=>R[y.name]??1000),oa=op.reduce((a,b)=>a+b,0)/op.length;
      c.g++;c.os+=oa;if(x.place===1){c.w++;c.run++;c.rs+=oa;c.rn++;if(c.run>c.best){c.best=c.run;c.bs=c.rs;c.bn=c.rn}}else{c.run=0;c.rs=0;c.rn=0}
      if(Number.isFinite(x.kills)&&Number.isFinite(x.deaths)){c.k+=x.kills;c.d+=x.deaths;c.n++}
      if(Number.isFinite(x.sds))c.sd+=x.sds;if(Number.isFinite(x.dmg))c.dmg+=x.dmg}
    for(const x of m.results)R[x.name]=(R[x.name]??1000)+m.d.all[x.name]}
  const A=Object.values(S),L=n=>n.toLocaleString(),out=[];
  const add=(c,val,disp,sub)=>out.push({name:c.name,val,disp,sub,k:c.k,g:c.g});
  for(const c of A){
    if(key=="kd"&&c.n>=3)add(c,c.d?c.k/c.d:c.k?Infinity:0,c.d?(c.k/c.d).toFixed(2):c.k?"∞":"0.00",`${c.k} KOs · ${c.d} deaths · ${c.n} games`);
    if(key=="kos"&&c.k>0)add(c,c.k,String(c.k),`${c.n} games with stats`);
    if(key=="dmg"&&c.dmg>0)add(c,c.dmg,L(Math.round(c.dmg)),`${c.g} games`);
    if(key=="sds"&&c.sd>0)add(c,c.sd,String(c.sd),`${c.g} games`);
    if(key=="wr"&&c.g>=5)add(c,c.w/c.g,Math.round(100*c.w/c.g)+"%",`${c.w}W ${c.g-c.w}L · avg opp ${Math.round(c.os/c.g)}`);
    if(key=="streak"){const v=sv=="cur"?c.run:c.best;if(v>=2)add(c,v,String(v),sv=="cur"?`longest ${c.best} · avg opp ${Math.round(c.rs/c.rn)}`:`${c.w}W of ${c.g} · now ${c.run} · avg opp ${Math.round(c.bs/c.bn)}`)}
  }
  return out.sort((a,b)=>b.val===a.val?(b.k-a.k||b.g-a.g):b.val>a.val?1:-1);
}
function podiums(){return`<h3 style="font:10px/1.6 var(--pf);margin:22px 0 10px">ALL-TIME PODIUMS</h3>${Object.keys(STATS).map(podiumCard).join("")}`}
function podiumCard(k){
  const rows=statRows(k,"all","all","best").slice(0,3),S=STATS[k];
  const slot=i=>{const r=rows[i];return r?`<div class="slot">${medal(i,22)}<div class="pn">${esc(r.name)}</div><div class="pr">${r.disp}</div><div class="blk b${i}"></div></div>`:`<div class="slot" style="visibility:hidden"><div class="pr">&nbsp;</div><div class="blk b${i}"></div></div>`};
  return`<div class="card" data-stat="${k}" data-sr="all" data-sm="all"><div class="row" style="margin-bottom:0"><b class="ct" style="flex:1">${S.t}</b><span class="sub">see all ›</span></div>${rows.length?`<div class="pod mini">${slot(1)}${slot(0)}${slot(2)}</div>`:`<div class="sub" style="margin-top:6px">${k=="kd"||k=="wr"?"Nobody qualifies yet.":"Nothing recorded yet."}</div>`}</div>`;
}
function statPage(){
  const S=STATS[stat],rows=statRows(stat,srange,smode,ssv),seg=(o,cur,fn)=>`<div class="seg">${Object.keys(o).map(k=>`<button class="${k==cur?"on":""}" onclick="${fn}='${k}';render()">${o[k]}</button>`).join("")}</div>`;
  const chips=`<div class="seg w">${Object.keys(STATS).map(k=>`<button class="${k==stat?"on":""}" onclick="stat='${k}';render()">${STATS[k].c}</button>`).join("")}</div>`;
  const sv=stat=="streak"?`<div class="seg"><button class="${ssv=="best"?"on":""}" onclick="ssv='best';render()">Longest run</button><button class="${ssv=="cur"?"on":""}" onclick="ssv='cur';render()">Active now</button></div>`:"";
  const needs=["kd","kos","dmg","sds"].includes(stat);
  const list=rows.length?rows.map((r,i)=>`<div class="card lb" data-n="${esc(r.name)}"><div class="rk">${i<3?medal(i):i+1}</div><div class="nm">${esc(r.name)}<div class="sub">${r.sub}</div></div><div class="elo">${r.disp}</div></div>`).join(""):`<div class="card"><div class="msg">${needs?"No stats recorded for this filter. Scan the second results screen, or type KOs, deaths, SDs, and damage when you add a match.":stat=="streak"?(ssv=="cur"?"Nobody is on a streak of 2+ right now.":"No streaks of 2+ for this filter."):"Nobody has enough games for this filter yet."}</div></div>`;
  return`<button class="g" onclick="stat='';tab=sfrom;sel=sfsel;render();scrollTo(0,0)">← Back</button><div style="height:12px"></div>${chips}<div class="card"><b>${S.t}</b><div class="msg">${S.d}${needs?" Only matches with stats recorded count.":""}</div></div>${seg(SR,srange,"srange")}${seg(SM,smode,"smode")}${sv}${list}${podiums()}`;
}
async function saveMatch(){
  const known=Object.keys(D.players);
  const r=draft.map(x=>{const n=x.name.trim(),c0=(x.char||"").trim(),c=CH.find(k=>k.toLowerCase()==c0.toLowerCase())||c0;return{name:known.find(k=>k.toLowerCase()==n.toLowerCase())||n,place:x.place,...(c?{char:c.slice(0,30)}:{}),...statsOf(x)}}).filter(x=>x.name);
  if(r.length<2)return alert("Need at least two players.");
  if(new Set(r.map(x=>x.name.toLowerCase())).size<r.length)return alert("Each username must be unique.");
  const b=document.getElementById("sv");b.disabled=true;
  try{await api("matches",{method:"POST",body:JSON.stringify({passcode:pass,results:r})});draft=[{name:"",place:1},{name:"",place:2}];note="";tab="lb";await load();render()}
  catch(e){if(e.status==401){pass="";ls("pass","");render()}alert(e.message);b.disabled=false}
}
async function del(id){if(!confirm("Delete this match? Ratings will be recalculated."))return;try{await api("matches",{method:"DELETE",body:JSON.stringify({admin,id})});await load()}catch(e){alert(e.message)}}
function csv(){
  const rows=["match_id,date,mode,place,player,character,kills,deaths,sds,damage"];
  D.matches.forEach(m=>m.results.forEach(x=>rows.push([m.id,new Date(m.ts).toISOString(),LB[m.mode],x.place,'"'+x.name.replace(/"/g,'""')+'"','"'+(x.char||"").replace(/"/g,'""')+'"',x.kills??"",x.deaths??"",x.sds??"",x.dmg??""].join(","))));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));a.download="smash-elo-matches.csv";a.click();
}
async function shrink(file){
  const bm=await createImageBitmap(file).catch(()=>{throw new Error("Couldn't open that image. Try a screenshot or a JPEG/PNG photo.")}),s=Math.min(1,1568/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=bm.width*s;c.height=bm.height*s;
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.92).split(",")[1];
}
document.getElementById("f").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  document.getElementById("st").textContent="Reading screenshot…";
  try{
    const j=await api("scan",{method:"POST",body:JSON.stringify({passcode:pass,roster:Object.keys(D.players),chars:CH,image:await shrink(file)})});
    if(j.players.length<2){note=j.problem?"Couldn't read it: "+j.problem:"Couldn't read that screen. Enter results by hand."}
    else{({draft,note}=fromScan(j.players))}
  }catch(err){note=err.message;if(err.status==401){pass="";ls("pass","")}}
  render();
};
load();render();setInterval(()=>{if(!document.hidden)load()},8000);setInterval(updateNow,15000);
