function makeDemo(){

  const pl={Pixel:[1.5,["Kirby","Marth","Ness"]],Nova:[1.35,["Fox","Falco","Sheik"]],Rook:[1,["Link","Ike","Samus"]],Echo:[.85,["Pikachu","Lucina","Mario"]],Bolt:[.65,["Mario","Luigi","Ryu"]],Mango:[.45,["Samus","Fox","Kirby"]]},names=Object.keys(pl);

    out.push({id:"demo"+id++,ts:new Date(ts).toISOString(),results:sc.map((x,k)=>({name:x.p,place:k+1,char:rnd()<.05?"Random":x.c,...(rnd()<.05?{rnd:true,char:"Random"}:{}),...(stats?{kills:Math.max(0,Math.round((n-k)*1.4+rnd()*3-1)),deaths:Math.max(0,Math.round(k*1.5+rnd()*2)),sds:rnd()<.12?1:0,dmg:Math.round(60+rnd()*140+(n-k)*25)}:{})}))})};
  const mid=new Date();mid.setHours(0,0,0,0);const m0=+mid;
  for(let d=59;d>=0;d--){
    const k=d==0?6:d==1?5:d<14?[2,3,4,6,8][Math.floor(rnd()*5)]:[0,2,3,4,6,8][Math.floor(rnd()*6)],r=rnd(),hr=r<.12?1+Math.floor(rnd()*3):r<.3?10+Math.floor(rnd()*6):18+Math.floor(rnd()*5);

}
